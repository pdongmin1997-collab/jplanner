<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J플래너</title>
<meta name="theme-color" content="#1b4b7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J플래너">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--navy:#1b4b7a;--blue:#3f7cb0;--orange:#d9724a;--gold:#e0a94e;--bg:#f6f8fa;--card:#fff;--line:#e5e9ee;--text:#1c2733;--sub:#6b7a89;--abh:56px;--nbh:110px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
body.lock{overflow:hidden;position:fixed;width:100%;left:0;right:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.95)}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + var(--sab))}

/* appbar */
#appbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) 12px 8px;background:var(--navy);color:#fff;max-width:560px;margin:0 auto}
.logo{font-weight:800;font-size:16px;white-space:nowrap}
.apbtn{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;white-space:nowrap}
.tripname{flex:1;min-width:0;text-align:right;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 4px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--orange);font-size:22px;line-height:1;color:#fff;flex:none}

/* hero */
#hero{position:relative;color:#fff;padding:26px 18px 22px;min-height:190px;background:linear-gradient(135deg,#1b4b7a,#3f7cb0);background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end}
#heroLabel{font-size:12px;letter-spacing:.08em;opacity:.9}
#heroTitle{margin:4px 0 4px;font-size:27px;font-weight:800;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.35)}
#heroSub{font-size:13px;opacity:.95}
#dday{display:inline-block;margin-top:10px;align-self:flex-start;background:var(--gold);color:#3a2a08;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px}
#camBtn{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.35);font-size:18px}

/* nav */
#nav{position:sticky;top:var(--abh);z-index:40;background:rgba(246,248,250,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);max-width:560px;margin:0 auto}
#pagetabs{display:flex;gap:6px;padding:10px 12px 4px}
.ptab{flex:1;padding:8px;border-radius:10px;background:#e9eef3;font-weight:700;color:var(--sub)}
.ptab.on{background:var(--navy);color:#fff}
#daytabs{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none}
#daytabs::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:64px;padding:6px 8px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.25}
.chip small{color:var(--sub);font-size:11px}.chip b{font-size:14px}.chip em{font-style:normal;font-size:10px;color:var(--sub);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on small,.chip.on em{color:#cfe0ef}

.page{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 10px rgba(20,40,70,.05)}
h4.sec{margin:16px 2px 8px;font-size:14px;color:var(--sub)}

/* flights */
.flight{padding:12px 14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fcol{flex:1}.fcol.r{text-align:right}
.fcol .code{font-size:22px;font-weight:800;color:var(--navy)}.fcol .city{font-size:12px;color:var(--sub)}.fcol .ftime{font-weight:700}
.fmid{flex:none;text-align:center;color:var(--blue);font-size:11px;min-width:70px}.fmid span{display:block;font-size:20px}
.fedit{flex:none;font-size:13px;color:var(--sub);padding:4px}
.addline{width:100%;padding:11px;border:1.5px dashed #c7d2dc;border-radius:12px;color:var(--blue);font-weight:700;background:none}

/* docs */
.docrow{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.docrow:last-child{border:0}.docrow .di{font-size:20px}.docrow b{display:block;font-size:14px;word-break:break-all}.docrow small{color:var(--sub)}

/* day section + cards */
.daysec{scroll-margin-top:calc(var(--abh) + var(--nbh) + 6px)}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}.dayhead b{font-size:17px;color:var(--navy)}.dayhead span{color:var(--sub);font-size:13px}
.empty{padding:18px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:14px}
.icard{padding:12px;margin-bottom:10px;display:flex;gap:12px}
.icard.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 2px 10px rgba(20,40,70,.05)}}
.ico{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.ibody{flex:1;min-width:0}
.ititle{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ititle .tm{font-weight:800;color:var(--navy)}.ititle .nm{font-weight:700}
.alarmb{font-size:11px;background:#fff3e6;color:var(--orange);padding:1px 7px;border-radius:999px}
.meta{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:12px;color:var(--sub)}
.mvb{background:#eaf2f9;color:var(--blue);padding:1px 8px;border-radius:999px;font-size:11px}
.memo{margin-top:6px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.btns a,.btns button{padding:5px 10px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:600;color:var(--navy);text-decoration:none}
.btns .dg{color:#b3402a;background:#fdeeea}

/* bottom bar */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:8px;max-width:560px;margin:0 auto;padding:10px 12px calc(10px + var(--sab));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bb{flex:1;padding:13px;border-radius:14px;font-weight:800}.bb.p{background:var(--navy);color:#fff;flex:2}.bb.s{background:#eef2f6;color:var(--navy)}

/* overview */
#mapwrap{position:relative}
#map{height:54vh;min-height:300px;border-radius:16px;border:1px solid var(--line);overflow:hidden;z-index:1}
#mapmsg{padding:30px 16px;text-align:center;color:var(--sub);background:#fff;border-radius:16px;border:1px dashed var(--line)}
#panel{margin-top:10px;padding:12px 14px}
#pinfo{min-height:44px}#pinfo b{font-size:16px}#pinfo div{font-size:12px;color:var(--sub);margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0}.prog .bar{flex:1;height:8px;border-radius:99px;background:#e9eef3;overflow:hidden}.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));width:0;transition:width .4s}.prog span{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
.ctrl{display:flex;gap:8px}.ctrl button{flex:1;padding:11px;border-radius:12px;background:#eef2f6;font-weight:800;color:var(--navy)}.ctrl button.go{background:var(--orange);color:#fff}
.ctrl button:disabled{opacity:.5}
.pinicon,.char{background:none;border:0}
.pinw{position:relative;width:28px;height:28px}
.pinb{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pinb.v{background:var(--navy)}
.pinl{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#fff;border-radius:8px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);max-width:150px;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.charin{pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}.charin svg{display:block}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:100}
.backdrop{position:absolute;inset:0;background:rgba(10,20,35,.5);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
#sheetWrap.open .backdrop{opacity:1}#sheetWrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:#d5dce3;margin:8px auto 0}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px}.sheethead h3{margin:0;font-size:18px}.x{font-size:18px;color:var(--sub);padding:6px 8px}
#sheetBody{overflow-y:auto;padding:8px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fl{display:block;margin:10px 0 0;font-size:12px;color:var(--sub);font-weight:700}
.fl input,.fl textarea,.fl select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfcfd}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc{padding:6px 11px;border-radius:999px;background:#eef2f6;font-size:13px;font-weight:600;color:var(--text)}
.sc.on{background:var(--navy);color:#fff}
.srow{display:flex;gap:8px;margin-top:16px}.srow button{flex:1;padding:13px;border-radius:12px;font-weight:800}
.b-p{background:var(--navy);color:#fff;flex:2!important}.b-d{background:#fdeeea;color:#b3402a}.b-c{background:#eef2f6;color:var(--navy)}
.drow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f3f6f9;border-radius:10px;margin-top:6px;font-size:13px}.drow span{flex:1;word-break:break-all}
.tl{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.tl.on{border-color:var(--navy);background:#f1f6fb}.tl .tm{flex:1;min-width:0;text-align:left}.tl .tm b{display:block}.tl .tm small{color:var(--sub)}
.tl .mini{padding:5px 9px;border-radius:9px;background:#eef2f6;font-size:12px;font-weight:700}.tl .mini.d{background:#fdeeea;color:#b3402a}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.setrow small{display:block;color:var(--sub)}
.setrow button{padding:7px 12px;border-radius:10px;background:#eef2f6;font-weight:700;font-size:13px;white-space:nowrap}
.hcard{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}.hcard b{display:block;margin-bottom:2px}.hcard span{color:var(--sub);font-size:13px}
.note{font-size:12px;color:var(--sub);margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(86px + var(--sab));transform:translate(-50%,20px);background:rgba(28,39,51,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#alarmPop{position:fixed;left:12px;right:12px;top:calc(10px + var(--sat));max-width:536px;margin:0 auto;z-index:210;background:var(--orange);color:#fff;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#alarmPop b{display:block}#alarmPop div{flex:1}#alarmPop button{background:rgba(255,255,255,.25);padding:6px 12px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<div id="appbar">
  <div class="logo">✈️ J플래너</div>
  <button class="apbtn" data-act="help">사용법</button>
  <button class="tripname" data-act="trips"><span id="appTitle"></span> ▾</button>
  <button class="plus" data-act="newtrip" aria-label="새 여행">+</button>
</div>
<div id="app">
  <header id="hero">
    <button id="camBtn" data-act="camera" aria-label="배경 사진">📷</button>
    <div id="heroLabel"></div>
    <div id="heroTitle"></div>
    <div id="heroSub"></div>
    <div id="dday"></div>
  </header>
  <div id="nav">
    <div id="pagetabs">
      <button class="ptab on" data-act="page" data-p="s">일정</button>
      <button class="ptab" data-act="page" data-p="o">오버뷰</button>
    </div>
    <div id="daytabs"></div>
  </div>
  <main id="pgS" class="page"></main>
  <main id="pgO" class="page" hidden>
    <div id="mapwrap"><div id="map"></div><div id="mapmsg" hidden>지도를 불러오지 못했어요.<br>인터넷에 연결한 뒤 다시 열어주세요.</div></div>
    <div id="panel" class="card">
      <div id="pinfo"></div>
      <div class="prog"><div class="bar"><i id="progBar"></i></div><span id="progTxt"></span></div>
      <div class="ctrl"><button data-act="prev" id="bPrev">◀ 이전</button><button data-act="now" id="bNow">지금</button><button class="go" data-act="next" id="bNext">다음 ▶</button></div>
    </div>
  </main>
</div>
<div id="bottombar">
  <button class="bb p" data-act="additem">＋ 일정 추가</button>
  <button class="bb s" data-act="settings">⚙ 설정</button>
</div>
<div id="sheetWrap" hidden>
  <div class="backdrop" data-act="closesheet"></div>
  <div class="sheet"><div class="grab"></div>
    <div class="sheethead"><h3 id="sheetTitle"></h3><button class="x" data-act="closesheet" aria-label="닫기">✕</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast"></div>
<div id="alarmPop" hidden><span style="font-size:26px">⏰</span><div><b id="apT"></b><span id="apS"></span></div><button data-act="closealarm">확인</button></div>
<input type="file" id="bgIn" accept="image/*" hidden>
<input type="file" id="impIn" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var KEY='jplanner.v1';
var CATS={'항공':{e:'✈️',c:'#3f7cb0'},'숙소':{e:'🏨',c:'#8a6bbf'},'식당':{e:'🍽️',c:'#d9724a'},'카페':{e:'☕',c:'#a9734a'},'명소':{e:'📍',c:'#2f9e78'},'이동':{e:'🚆',c:'#5b7083'},'쇼핑':{e:'🛍️',c:'#d4577f'},'기타':{e:'📌',c:'#6b7a89'}};
var MOVES=['도보','지하철','버스','트램','기차','택시','항공','자전거'];
var DOW=['일','월','화','수','목','금','토'];
function p2(n){return String(n).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function isNum(v){return typeof v==='number'&&isFinite(v)}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function fd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayStr(){return fd(new Date())}
function dow(s){return DOW[pd(s).getDay()]}
function md(s){var d=pd(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일'}
function mdShort(s){var d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return fd(d)}
function diffDays(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function listDays(t){var out=[],a=pd(t.start),b=pd(t.end);if(b<a)b=a;for(var d=new Date(a),n=0;d<=b&&n<120;d.setDate(d.getDate()+1),n++)out.push(fd(d));return out}
function cityFor(t,i,total){var c=t.cities;if(!c||!c.length)return '';return c[Math.min(c.length-1,Math.floor(i*c.length/total))]}

/* ---------- store ---------- */
function mk(day,time,cat,name,place,lat,lng,move,memo,alarm){return {id:uid(),day:day,time:time,cat:cat,name:name,place:place,mapUrl:'',memo:memo||'',move:move||'',alarm:alarm||'',lat:lat,lng:lng,userDocs:[]}}
function seed(){
  var start=addDays(todayStr(),30),d=function(n){return addDays(start,n)};
  var t={id:uid(),title:'도쿄 2박 3일',start:start,end:d(2),note:'2인',cities:['도쿄'],bg:'',
    flights:[{id:uid(),date:start,no:'KE703',from:'ICN',fromCity:'서울',depart:'08:30',to:'HND',toCity:'도쿄',arrive:'10:50'},
             {id:uid(),date:d(2),no:'KE706',from:'HND',fromCity:'도쿄',depart:'19:00',to:'ICN',toCity:'서울',arrive:'21:40'}],
    items:[
      mk(d(0),'14:00','숙소','신주쿠 호텔 체크인','신주쿠역 호텔',35.6896,139.7006,'지하철','짐 맡기고 바로 출발'),
      mk(d(0),'16:30','명소','시부야 스카이','시부야 스카이',35.6585,139.7022,'지하철','일몰 시간에 맞춰서','16:00'),
      mk(d(0),'19:00','식당','이치란 라멘 시부야','이치란 시부야',35.6611,139.6989,'도보',''),
      mk(d(1),'10:00','명소','센소지','센소지',35.7148,139.7967,'지하철','아침 일찍 가면 한산해요','09:30'),
      mk(d(1),'13:00','식당','츠키지 장외시장','츠키지 장외시장',35.6655,139.7707,'지하철','해산물 점심'),
      mk(d(1),'15:30','카페','긴자 카페','긴자 카페',35.6717,139.7640,'도보',''),
      mk(d(2),'11:00','명소','메이지 신궁','메이지 신궁',35.6764,139.6993,'지하철','')
    ]};
  return {trips:[t],activeId:t.id};
}
function normTrip(t){t.cities=Array.isArray(t.cities)?t.cities:[];t.flights=Array.isArray(t.flights)?t.flights:[];t.items=Array.isArray(t.items)?t.items:[];t.items.forEach(function(i){i.userDocs=Array.isArray(i.userDocs)?i.userDocs:[]});t.note=t.note||'';t.bg=t.bg||'';return t}
function loadStore(){
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&Array.isArray(s.trips)&&s.trips.length){s.trips.forEach(normTrip);if(!s.trips.some(function(t){return t.id===s.activeId}))s.activeId=s.trips[0].id;return s}}}catch(e){}
  return seed();
}
var store=loadStore();
var memStore=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){toast('저장 공간이 부족해요. 첨부 파일을 줄여주세요');return false}}
save();
function cur(){return store.trips.find(function(t){return t.id===store.activeId})||store.trips[0]}
function itemsOf(t,day){return t.items.filter(function(i){return i.day===day}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'')})}
function allSorted(t){return t.items.slice().sort(function(a,b){return (a.day+(a.time||'')).localeCompare(b.day+(b.time||''))})}

/* ---------- utils ---------- */
var toastT;
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2200)}
var armedKey=null,armedT;
function armed(key,msg){if(armedKey===key){armedKey=null;clearTimeout(armedT);return true}armedKey=key;clearTimeout(armedT);armedT=setTimeout(function(){armedKey=null},3000);toast(msg||'한 번 더 누르면 삭제돼요');return false}
function download(name,text,type){var b=new Blob([text],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}
function safeName(s){return String(s||'jplanner').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)}
function resizeImage(file,max,q){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function readDataURL(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result)};fr.onerror=rej;fr.readAsDataURL(file)})}
function dataURLtoBlob(u){var p=u.split(','),m=/data:([^;]+)/.exec(p[0]);var bin=atob(p[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:m?m[1]:'application/octet-stream'})}
function openDoc(itemId,i){var t=cur(),it=t.items.find(function(x){return x.id===itemId});if(!it||!it.userDocs[i])return;var url=URL.createObjectURL(dataURLtoBlob(it.userDocs[i].data));var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000)}

/* ---------- map links ---------- */
function mq(it){return it.place||it.name}
function dirUrl(it){return it.mapUrl||('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(mq(it)))}
function viewUrl(it){return it.mapUrl||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mq(it)))}
function coordsFromUrl(u){var m=/@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(u||'')||/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(u||'');return m?{lat:+m[1],lng:+m[2]}:null}
function geocode(q){
  var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort()},8000);
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&q='+encodeURIComponent(q),{signal:ctrl.signal}).then(function(r){clearTimeout(to);return r.json()}).then(function(j){if(j&&j[0])return{lat:+j[0].lat,lng:+j[0].lon};return null}).catch(function(){clearTimeout(to);return null});
}

/* ---------- ICS ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function dtL(day,time){return day.replace(/-/g,'')+'T'+(time||'09:00').replace(':','')+'00'}
function buildICS(items){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//J Planner//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  items.forEach(function(it){
    var st=it.time||'09:00',hm=st.split(':').map(Number),endMin=Math.min(hm[0]*60+hm[1]+60,23*60+59),en=p2(Math.floor(endMin/60))+':'+p2(endMin%60);
    L.push('BEGIN:VEVENT','UID:'+it.id+'@jplanner','DTSTAMP:'+stamp,'DTSTART:'+dtL(it.day,st),'DTEND:'+dtL(it.day,en),'SUMMARY:'+icsEsc((CATS[it.cat]?CATS[it.cat].e+' ':'')+it.name));
    if(it.place)L.push('LOCATION:'+icsEsc(it.place));
    var desc=(it.memo||'')+(it.memo?'\n':'')+viewUrl(it);L.push('DESCRIPTION:'+icsEsc(desc));
    if(it.alarm){var ah=it.alarm.split(':').map(Number),diff=(hm[0]*60+hm[1])-(ah[0]*60+ah[1]);L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(it.name),'TRIGGER:'+(diff>0?'-PT'+diff+'M':'PT'+Math.abs(diff)+'M'),'END:VALARM')}
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function renderFormDocs(){var el=$('#fDocs');if(!el)return;el.innerHTML=form.docs.map(function(d,i){return '<div class="drow"><span>'+(/^data:image/.test(d.data)?'🖼️ ':'📄 ')+esc(d.name)+'</span><button data-act="rmdoc" data-i="'+i+'">✕</button></div>'}).join('')}
function addFiles(files){
  var list=Array.prototype.slice.call(files),chain=Promise.resolve();
  list.forEach(function(f){chain=chain.then(function(){
    if(/^image\//.test(f.type))return resizeImage(f,1400,.8).then(function(u){form.docs.push({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',data:u})}).catch(function(){toast('이미지를 읽지 못했어요: '+f.name)});
    if(f.size>2.5*1024*1024){toast('PDF는 2.5MB 이하만 첨부할 수 있어요');return}
    return readDataURL(f).then(function(u){form.docs.push({name:f.name,data:u})}).catch(function(){toast('파일을 읽지 못했어요')});
  })});
  chain.then(renderFormDocs);
}
function saveItem(){
  var t=cur(),day=$('#fDay').value,time=$('#fTime').value,name=$('#fName').value.trim(),place=$('#fPlace').value.trim(),mapUrl=$('#fMap').value.trim(),alarm=$('#fAlarm').value,memo=$('#fMemo').value.trim();
  if(!name){toast('일정 이름을 입력해주세요');return}
  var days=listDays(t);if(!day||days.indexOf(day)<0){toast('여행 기간 안의 날짜를 선택해주세요');return}
  var o=form.orig,lat=o?o.lat:null,lng=o?o.lng:null;
  var changed=!o||o.place!==place||o.mapUrl!==mapUrl||(!place&&o.name!==name);
  var cu=coordsFromUrl(mapUrl);
  var item={id:form.id||uid(),day:day,time:time||'09:00',cat:form.cat,name:name,place:place,mapUrl:mapUrl,memo:memo,move:form.move,alarm:alarm,lat:lat,lng:lng,userDocs:form.docs.slice()};
  var btn=$('[data-act="saveitem"]');if(btn)btn.disabled=true;
  var p;
  if(cu){item.lat=cu.lat;item.lng=cu.lng;p=Promise.resolve()}
  else if(changed||!isNum(item.lat)){toast('위치를 찾는 중…');p=geocode(place||name).then(function(r){if(r){item.lat=r.lat;item.lng=r.lng}else{item.lat=null;item.lng=null;toast('위치를 찾지 못했어요. 지도 검색어를 더 자세히 적어보세요')}})}
  else p=Promise.resolve();
  p.then(function(){
    var snap=JSON.stringify(t.items),idx=t.items.findIndex(function(x){return x.id===item.id});
    if(idx>=0)t.items[idx]=item;else t.items.push(item);
    if(!save()){t.items=JSON.parse(snap);if(btn)btn.disabled=false;return}
    ui.day=day;closeSheet();renderAll();if(isNum(item.lat))toast('저장했어요');
  });
}

function getRoute(a,b,mv){

  var ctrl=new AbortController(),to=setTimeout(function(){ctrl.abort()},7000);
  return fetch('https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson',{signal:ctrl.signal})
   .then(function(r){clearTimeout(to);return r.json()})
   .then(function(j){var c=j&&j.routes&&j.routes[0]&&j.routes[0].geometry.coordinates;if(c&&c.length>1){var pts=c.map(function(p){return [p[1],p[0]]});routeCache[key]=pts;return pts}routeFail[key]=Date.now();return null})

function animate(pts,mv,forward,done){

  ov.anim=true;updatePanel();

  var t0=performance.now(),flip=pts[pts.length-1][1]<pts[0][1];
  function frame(now){
    var t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,d=e*total,k=1;
    while(k<cum.length-1&&cum[k]<d)k++;

    var pos=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
    charMarker.setLatLng(pos);setSprite(kind,Math.floor(now/180)%2,flip);

    case 'savetrip':saveTrip();break;
    case 'edittrip':openTripSheet(id);break;
    case 'deltrip':if(armed('tr:'+id)){closeSheet();deleteTrip(id)}break;
    case 'deltripl':if(armed('tr:'+id)){deleteTrip(id);openTripsSheet()}break;
    case 'switchtrip':store.activeId=id;save();ui.day=null;closeSheet();renderAll();toast(cur().title);break;
    case 'prev':step(-1);break;
    case 'next':step(1);break;
    case 'now':goNow();break;
    case 'settitle':var v=$('#sTitle').value.trim();if(!v){toast('제목을 입력해주세요');break}t.title=v;save();renderBar();renderHero();toast('제목을 바꿨어요');break;
    case 'install':
      if(deferredInstall){deferredInstall.prompt();deferredInstall=null}
      else toast('브라우저 메뉴의 "홈 화면에 추가" 또는 "앱 설치"를 눌러주세요');break;
    case 'notif':
      if(!('Notification' in window)){toast('이 브라우저는 알림을 지원하지 않아요');break}
      Notification.requestPermission().then(function(p){toast(p==='granted'?'알림을 허용했어요':'알림이 허용되지 않았어요');openSettings()});break;
    case 'export':download('jplanner-backup-'+todayStr().replace(/-/g,'')+'.json',JSON.stringify(store),'application/json');toast('백업 파일을 만들었어요');break;
    case 'import':$('#impIn').click();break;
    case 'icsall':var all=allSorted(t);if(!all.length){toast('내보낼 일정이 없어요');break}download(safeName(t.title)+'.ics',buildICS(all),'text/calendar;charset=utf-8');toast('캘린더 파일을 만들었어요');break;
    case 'reset':if(armed('reset','한 번 더 누르면 모든 데이터가 지워져요')){try{localStorage.removeItem(KEY)}catch(x){}store=seed();save();ui.day=null;closeSheet();renderAll();toast('초기화했어요')}break;
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='fileIn'){addFiles(el.files);el.value=''}
  else if(el.id==='bgIn'&&el.files[0]){
    resizeImage(el.files[0],1000,.72).then(function(u){var t=cur(),old=t.bg;t.bg=u;if(!save())t.bg=old;else{renderHero();toast('배경 사진을 바꿨어요')}}).catch(function(){toast('이미지를 읽지 못했어요')});el.value='';
  }
  else if(el.id==='impIn'&&el.files[0]){
    var f=el.files[0];el.value='';
    readDataURL(f).then(function(u){var txt=decodeURIComponent(escape(atob(u.split(',')[1])));var s=JSON.parse(txt);if(!s||!Array.isArray(s.trips)||!s.trips.length)throw 0;if(!confirm('현재 데이터를 백업 파일 내용으로 덮어쓸까요?'))return;s.trips.forEach(normTrip);if(!s.trips.some(function(t){return t.id===s.activeId}))s.activeId=s.trips[0].id;store=s;save();ui.day=null;closeSheet();renderAll();toast('불러왔어요')}).catch(function(){toast('올바른 백업 파일이 아니에요')});
  }
});

/* ---------- boot ---------- */
renderAll();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
